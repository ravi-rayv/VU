[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vertical25d"
version = "0.1.0"
description = "Vertical land-use stratification from open POIs and satellite building heights (2.5D) for any study area"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Ravi Satyappa Dabbanavar", email = "ravisd@nittesoa.ac.in" },
  { name = "Rohini N", email = "rohini@nittesoa.ac.in" },
]
maintainers = [{ name = "Ravi Satyappa Dabbanavar", email = "ravisd@nittesoa.ac.in" }]
keywords = ["urban analytics", "points of interest", "building height", "mixed land use", "OpenStreetMap",
            "Google Earth Engine", "entropy", "mutual information"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyogrio>=0.7",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "osmnx>=1.9",
  "earthengine-api>=0.1.390",
]

[project.optional-dependencies]
app = ["streamlit>=1.48", "requests", "pillow", "streamlit-folium>=0.20", "folium>=0.16", "pydeck>=0.8"]
dev = ["pytest>=7"]

[project.scripts]
vertical25d = "vertical25d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vertical25d = ["data/*.csv", "data/demo/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
